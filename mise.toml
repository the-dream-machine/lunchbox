#:schema https://mise.jdx.dev/schema/mise.json
#:tombi schema.strict = false

[settings]
experimental = true
lockfile = true
pin = true
npm.package_manager = "bun"

[tools]
bun = "1.3.11"
hk = "1.40.0"
node = "25.9.0"
pkl = "0.31.1"
"npm:@sourcegraph/amp" = "0.0.1775318725-g13b193"
"npm:opencode-ai" = "1.3.13"
"npm:oxfmt" = "0.43.0"
"npm:oxlint" = "1.58.0"

[tasks.amp]
run = "amp --no-ide"
description = "Start the Amp CLI without IDE connection"

[tasks.dev]
run = "bun run --watch src/index.tsx"
description = "Start the dev server with watch mode"

[tasks."schema:generate"]
run = "bun run scripts/generate-schema.ts"
description = "Generate JSON schema from Zod config schema"
